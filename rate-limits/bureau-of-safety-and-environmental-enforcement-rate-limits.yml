headers: []
observed:
  - url: https://www.data.bsee.gov/Well/API/Default.aspx
    status: 200
    rate_limit_headers: none
    checked: '2026-09-05'
  - url: https://www.data.bsee.gov/Main/RawData.aspx
    status: 200
    rate_limit_headers: none
    checked: '2026-09-05'
notes:
  - >-
    No X-RateLimit-*, RateLimit-*, or Retry-After header was returned on any probe.
  - >-
    No 429 behaviour is documented. Because www.data.bsee.gov answers HTTP 200 with an
    HTML error shell for unknown paths, a client cannot rely on status codes to detect
    throttling either.
  - >-
    BSEE's only published guidance about heavy use is the Raw Data page's statement that
    the bulk downloads exist as an alternative for consumers who need the whole dataset,
    and that BSEE does not support them.
