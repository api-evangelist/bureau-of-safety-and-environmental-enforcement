description: >-
  BSEE publishes no rate limits, no quotas and no throttling policy for the Data Center,
  and returns no rate-limit headers on any observed response. An honest zero: there is
  nothing here for an agent to read at runtime, and no documented ceiling to plan against.

  This file replaces a 2026-05-04 bulk-sweep scaffold that asserted per-tier limits
  (10 / 100 / 1,000 requests per minute against api-key scopes) and a full
  X-RateLimit-* header set. BSEE issues no API keys and returns none of those headers.
  Removed 2026-09-05.
limit_count: 0
