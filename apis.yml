x-coverage:
  state: unreadable
  reason: no-machine-readable-spec
  detail: >-
    BSEE's offshore data is fully public and free, but it is only reachable through
    ASP.NET online-query forms and zipped delimited-ASCII downloads on www.data.bsee.gov
    — no OpenAPI, GraphQL, AsyncAPI, WSDL or MCP contract exists on any bsee.gov host,
    and the host answers HTTP 200 with a "Data Center 404 Error" HTML shell for every
    path that does not exist, so even path discovery returns false positives.
  evidence:
    - url: https://www.data.bsee.gov/openapi.json
      status: 200
    - url: https://www.data.bsee.gov/zzzz-not-a-real-page.aspx
      status: 200
    - url: https://www.bsee.gov/llms.txt
      status: 404
    - url: https://www.bsee.gov/data.json
      status: 404
    - url: https://timsweb.bsee.gov/
      status: 200
