description: >-
  Probe of the named /.well-known/ document set on every BSEE host the record knows.
  One real document is served: an RFC 9116 security.txt on bsee.gov and www.bsee.gov,
  pointing at the Department of the Interior vulnerability disclosure policy. Every
  other path is absent. Two hosts answer 200 for ANY path — www.data.bsee.gov (ASP.NET
  Data Center) returns its "Data Center 404 Error" shell and timsweb.bsee.gov returns
  the TIMS Web login page — so their 200s are soft-404s, not documents, and are recorded
  as misses. Control probes: https://www.data.bsee.gov/zzzz-not-a-real-page.aspx -> 200
  (28,245 byte 404 shell) and https://timsweb.bsee.gov/zzzz-not-real.jsp -> 200 (TIMS Web
  Login). https://www.bsee.gov/zzzz-not-a-real-page -> 404, so the www.bsee.gov 404s are real.
