description: >-
  BSEE publishes NO tiered plans for data access. The BSEE Data Center — every online
  query and every bulk raw-data download — is free and requires no account. There is
  therefore no free/pro/enterprise ladder, no quota, and no overage.

  What BSEE does publish is a statutory cost-recovery fee schedule under 30 CFR 250.125
  for filing regulated applications through the eWell / TIMS permitting system. Those are
  regulatory filing fees paid by offshore operators, not charges for API or data access,
  and they are recorded below as `fee_schedule` rather than as plans so they are never
  mistaken for API pricing.

  This file replaces a 2026-05-04 bulk-sweep scaffold that asserted Free / Professional /
  Enterprise tiers with invented request quotas (1,000 and 100,000 requests per month) and
  invented rate limits. None of that existed. Removed 2026-09-05.
